# Gitea Actions CI. Results for feature/<ISSUE-KEY>-* branches are reported to the
# matching Multica issue. The emulator check (`pnpm test:emulator`) needs Java and
# runs locally until a runner image provides it.
name: ci

on:
  push:
    branches: ["master", "feature/**"]
  pull_request:

jobs:
  check:
    runs-on: security-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
